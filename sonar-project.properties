# SonarCloud project config. Keys come from the project's Information panel.
sonar.organization=x-ror
sonar.projectKey=x-ror_lava

# Analyze only the JS runtime layer. Tests, scripts, vendored trees, and the
# Odin core (no SonarCloud analyzer anyway) are all left out by scoping sources
# to this single directory.
sonar.sources=pkg/runtime/js

# Defer JavaScript *style* to the project's own linter (oxlint, .oxlintrc.json).
# The runtime JS modules are hand-written for JSC in a deliberate, codebase-wide
# style — var, closures, and indexed for-loops, mirroring the WHATWG/Node
# reference implementations — that oxlint is configured to accept (no-var, for
# one, is intentionally not enabled there). SonarJS's modern-style rules below
# therefore report noise, not findings, and would otherwise demand rewriting
# every module into a style inconsistent with the rest of this layer. Bug,
# security, and duplication rules still apply.
sonar.issue.ignore.multicriteria=jsstyle1,jsstyle2,jsstyle3,jsstyle4,jsstyle5,jsstyle6,jsstyle7
# S3504 no-var: var is used consistently across the runtime JS.
sonar.issue.ignore.multicriteria.jsstyle1.ruleKey=javascript:S3504
sonar.issue.ignore.multicriteria.jsstyle1.resourceKey=pkg/runtime/js/**/*
# S2004 no-nested-functions: spec-algorithm closures (e.g. stream tee) nest deep.
sonar.issue.ignore.multicriteria.jsstyle2.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.jsstyle2.resourceKey=pkg/runtime/js/**/*
# S7721 consistent-function-scoping: helpers stay near their closure state.
sonar.issue.ignore.multicriteria.jsstyle3.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.jsstyle3.resourceKey=pkg/runtime/js/**/*
# S6582 prefer-optional-chain: the `x && x.y` guard form is used throughout.
sonar.issue.ignore.multicriteria.jsstyle4.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.jsstyle4.resourceKey=pkg/runtime/js/**/*
# S7735 no-negated-condition: style preference, not a defect.
sonar.issue.ignore.multicriteria.jsstyle5.ruleKey=javascript:S7735
sonar.issue.ignore.multicriteria.jsstyle5.resourceKey=pkg/runtime/js/**/*
# S4138 prefer-for-of: indexed for-loops are used deliberately.
sonar.issue.ignore.multicriteria.jsstyle6.ruleKey=javascript:S4138
sonar.issue.ignore.multicriteria.jsstyle6.resourceKey=pkg/runtime/js/**/*
# S6544 no-misused-promises (void-return): dynamic JS, no type contracts.
sonar.issue.ignore.multicriteria.jsstyle7.ruleKey=javascript:S6544
sonar.issue.ignore.multicriteria.jsstyle7.resourceKey=pkg/runtime/js/**/*
