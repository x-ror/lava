# Lava agent registry (human-readable mirror of config/agents.json).
# Runtime loads agents.json. Keep both in sync when editing roles/models.
#
# Slash commands (/odin-feature, /pr-gate, …) and the workflow engine both
# resolve agents through this registry. Same command names for human + system.

defaults:
  max_turns: 100
  max_fix_rounds: 3
  isolation: worktree
  allow_merge: false

providers:
  - grok
  - claude
  - codex
  - none

dual_review:
  enabled: true
  implement_provider: auto
  review_provider: auto

agents:
  planner:
    role: Analyze issues and build a dependency DAG
    command: planner
    prompt: agents/prompts/planner.md
    provider: auto
    isolation: none

  odin-feature:
    role: Implement a feature with TDD
    command: odin-feature
    prompt: agents/prompts/odin-feature.md
    provider: auto
    isolation: worktree
    design_first: true

  critic:
    role: Adversarial critique before pr-gate
    command: critic
    prompt: agents/prompts/critic.md
    provider: auto
    isolation: worktree
    prefer_alt_provider: true

  pr-gate:
    role: Hard merge gate (tests + review). Required before PR.
    command: pr-gate
    prompt: agents/prompts/pr-gate.md
    provider: auto
    isolation: worktree
    hard_gate: true

  fixer:
    role: Fix from pr-gate findings or red tests
    command: fixer
    prompt: agents/prompts/fixer.md
    provider: auto
    isolation: worktree

commands:
  odin-feature: odin-feature
  pr-gate: pr-gate
  planner: planner
  fixer: fixer
  critic: critic
  run-pipeline: pipeline
