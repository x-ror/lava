name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux-first: the macOS and Windows jobs are intentionally DISABLED while development
# focuses on Linux (darwin/windows native code is kept as stubs). Restore them from git
# history (this file before the "Linux-first CI" change) when cross-platform CI is wanted
# again. The Odin/LLVM version below (setup-odin inputs) may need bumping over time as the
# project tracks newer Odin dev builds.

jobs:
  linux:
    name: Linux (full build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev pkg-config

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      - name: Type-check
        run: make check

      - name: JavaScript lint and format
        run: make check-js

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (Lava behavior)
        run: make test-lava

      # Real socket transport: start a Node origin and require lava's fetch output
      # to match Node's, over http://, https:// (TLS), and IPv6 loopback. Excluded
      # from `make test` because it binds a local port; runs here as its own gate.
      - name: Fetch transport smoke
        run: make test-fetch-smoke

      # Benchmarks: print the node-vs-Lava ratio table in the job log. Report-only for
      # now (never fails) because the bench/thresholds.json caps are uncalibrated
      # starters — once the ratios here are observed and the caps tightened, flip this
      # to `make bench-gate` to enforce regressions. See bench/README.md.
      - name: Benchmarks (report-only)
        run: make bench
