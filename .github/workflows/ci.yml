name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two things may need tuning over time:
#   1. The Odin/LLVM version below (setup-odin inputs) as the project tracks
#      newer Odin dev builds.
#   2. Windows cannot link/run because the WebKit Windows port's
#      JavaScriptCore.lib/.dll is not available on GitHub runners. The Windows
#      job therefore type-checks, validates Windows codegen (-build-mode:obj),
#      and runs the JSC-free event-loop unit tests — everything except the final
#      JSC link.

jobs:
  linux:
    name: Linux (full build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev pkg-config

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      - name: Type-check
        run: make check

      - name: JavaScript lint and format
        run: make check-js

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (Lava behavior)
        run: make test-lava

  macos:
    name: macOS (full build + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSSL
        # The fetch TLS transport links Homebrew OpenSSL on Darwin (keg-only;
        # scripts/build.sh adds its lib path). brew is preinstalled on the runner.
        run: brew install openssl@3

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      - name: Type-check
        run: make check

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (Lava behavior)
        run: make test-lava

  windows:
    name: Windows (type-check + codegen + eventloop tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Pinned oven-sh/WebKit release providing the prebuilt Windows JavaScriptCore
      # (see scripts/fetch-webkit-windows.sh). Bump to re-provision a newer JSC.
      WEBKIT_TAG: autobuild-9cb85a0716065c461bea14a0de9fe7139e5323aa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      # Type-check every package natively for the Windows target. This exercises
      # pkg/jsc/bindings_windows.odin and the IOCP event-loop backend.
      - name: Type-check
        run: |
          odin check cmd/lava -collection:lava=.
          odin check pkg/runtime -no-entry-point -collection:lava=.
          odin check pkg/runtime/eventloop -no-entry-point
          odin check pkg/std/sqlite -no-entry-point
          odin check pkg/jsc -no-entry-point

      # The event-loop core has no JavaScriptCore dependency, so it links and
      # runs for real on Windows (IOCP backend included).
      - name: Event-loop unit tests
        run: odin test pkg/runtime/eventloop

      # Full Windows codegen of the JSC-using runtime + CLI. Stops before the
      # link step (which would need JavaScriptCore.lib), proving every Windows
      # source path compiles.
      - name: Windows codegen (no link)
        run: |
          mkdir -p build
          odin build cmd/lava -collection:lava=. -build-mode:obj -out:build/lava.obj

      # --- Experimental: real link + JSC-backed smoke (#36) ---
      # JavaScriptCore is provisioned from the Bun project's WebKit fork (static
      # libs; see scripts/fetch-webkit-windows.sh). The link is still being brought
      # up (static-CRT/ABI reconciliation against Odin's toolchain), so this step is
      # non-blocking (continue-on-error) — it must not regress the green
      # type-check/codegen CI above while iterated. Make it required once reliable.
      - name: Cache JavaScriptCore (bun-webkit)
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: webkit
          key: bun-webkit-windows-amd64-${{ env.WEBKIT_TAG }}

      - name: Provision JavaScriptCore
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        run: WEBKIT_TAG="$WEBKIT_TAG" DEST=webkit scripts/fetch-webkit-windows.sh

      # Set up the MSVC x64 developer environment (LIB/INCLUDE/PATH) so the linker
      # resolves system import libs via $LIB rather than absolute "C:\Program
      # Files\..." paths on the command line (which split on the space → LNK1181).
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Windows link + JSC smoke (experimental)
        continue-on-error: true
        run: |
          mkdir -p build
          # Resolve the JSC static libs via the linker's LIB search path rather than
          # a /LIBPATH on the command line, so no path-with-spaces reaches the link
          # line. msvc-dev-cmd already populated LIB with the CRT/SDK dirs.
          WK_WIN="$(cygpath -w "$PWD/webkit/bun-webkit/lib")"
          export LIB="$WK_WIN;$LIB"
          # OpenSSL (tls.odin foreign-imports libssl.lib/libcrypto.lib). The runner
          # ships OpenSSL; add the dir that actually holds the import libs to LIB.
          OSSL_LIB="$(find '/c/Program Files/OpenSSL' '/c/Program Files/OpenSSL-Win64' -iname 'libssl.lib' 2>/dev/null | head -1 || true)"
          if [ -n "$OSSL_LIB" ]; then
            export LIB="$(cygpath -w "$(dirname "$OSSL_LIB")");$LIB"
            echo "OpenSSL libs: $(dirname "$OSSL_LIB")"
          else
            echo "WARNING: libssl.lib not found under C:\\Program Files\\OpenSSL*"
          fi
          # clang emits 128-bit int builtins (__divti3, __fixdfti) into JSC/WTF;
          # supply LLVM's compiler-rt builtins lib so lld can resolve them.
          RT_LIB="$(find '/c/Program Files/LLVM' -iname 'clang_rt.builtins-x86_64.lib' 2>/dev/null | head -1 || true)"
          if [ -n "$RT_LIB" ]; then
            export LIB="$(cygpath -w "$(dirname "$RT_LIB")");$LIB"
            echo "compiler-rt: $RT_LIB"
            echo "--- all clang_rt.builtins libs ---"; find '/c/Program Files/LLVM' -iname 'clang_rt.builtins*' 2>/dev/null
            echo "--- does it define __divti3/__fixdfti? ---"
            NM="$(command -v llvm-nm || echo '/c/Program Files/LLVM/bin/llvm-nm.exe')"
            "$NM" "$RT_LIB" 2>/dev/null | grep -iE "divti3|fixdfti" || echo "NOT FOUND in $RT_LIB"
          else
            echo "WARNING: clang_rt.builtins-x86_64.lib not found under C:\\Program Files\\LLVM"
          fi
          # Static JSC pulls in WTF, bmalloc, ICU, the compiler-rt builtins, and a
          # broad set of Win32 system libraries (WTF threading/crypto/networking
          # shims; Synchronization.lib for WaitOnAddress/WakeByAddressSingle).
          # JavaScriptCore.lib itself comes from bindings_windows.odin's import.
          SYSLIBS="clang_rt.builtins-x86_64.lib Synchronization.lib user32.lib gdi32.lib ole32.lib oleaut32.lib shell32.lib shlwapi.lib advapi32.lib winmm.lib bcrypt.lib crypt32.lib ws2_32.lib userenv.lib dbghelp.lib iphlpapi.lib version.lib comctl32.lib rpcrt4.lib secur32.lib usp10.lib windowscodecs.lib"
          # Use Odin's bundled lld linker (from the setup-odin LLVM) — its invocation
          # quotes the MSVC toolchain paths correctly (link.exe via the default path
          # split "C:\Program Files\..." → LNK1181).
          odin build cmd/lava -collection:lava=. -out:build/lava.exe -linker:lld \
            -extra-linker-flags:"WTF.lib bmalloc.lib sicuuc.lib sicuin.lib sicudt.lib $SYSLIBS"
          echo 'console.log("jsc-smoke:" + (40 + 2))' > smoke.js
          ./build/lava.exe run smoke.js | tee smoke.out
          grep -q "jsc-smoke:42" smoke.out
