name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux-first: the macOS and Windows jobs are intentionally DISABLED while development
# focuses on Linux (darwin/windows native code is kept as stubs). Restore them from git
# history (this file before the "Linux-first CI" change) when cross-platform CI is wanted
# again. The Odin/LLVM version below (setup-odin inputs) may need bumping over time as the
# project tracks newer Odin dev builds.

jobs:
  linux:
    name: Linux (full build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev pkg-config

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
          run-install: true

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: '18'

      - name: Type-check
        run: make check

      # `make fmt` once exited non-zero for every caller (a strip-semicolon
      # parse failure, fixed by -collection:lava=.) and nothing noticed, because
      # no CI step ran it. This pins both that fmt runs and that the tree is
      # already formatted: fmt rewrites in place, so any diff is a formatting
      # violation (or a fmt regression).
      - name: Format (Odin)
        run: make fmt && git diff --exit-code

      - name: JavaScript lint and format
        run: make check-js

      - name: Markdown lint
        run: make check-md

      - name: Workflow lint
        run: make check-actions

      - name: Build
        run: make build

      - name: Test
        run: make test

      # Differential property tests: fast-check generates the corpus and both
      # runtimes answer it in one process pair per property. It was out of CI when
      # it spawned a pair per input (64s for 200 inputs); batched it is ~1s for
      # 5000, and at that size it found a real utf-16le divergence the hand-picked
      # oracle cases missed.
      - name: Test (differential property suite)
        run: make test-property

      # MUTATION GATE. Breaks the code each recorded test claims to pin and requires
      # the test to go red. It exists because three tests in #321 passed for the
      # wrong reason and every one was caught only by doing this by hand: an oracle
      # case that threw inside its own setup and so printed identical output on both
      # runtimes, a property suite that compared zero inputs after a NaN run count,
      # and an event-loop test whose timer gave platform_poll a positive timeout —
      # which counts as progress by itself, so the no-progress tick under test never
      # happened. Rebuilds bin/lava per embedded-JS mutation, hence its own step.
      - name: Test (mutation gate)
        run: make test-mutation

      - name: Test (Lava behavior)
        run: make test-lava

      # The same oracle suites with LAVA_HOSTFN_DISABLE=1, which forces every native
      # onto the public-C-API fallback instead of JSC's private host-call ABI. Half of
      # a documented fallback had been running nowhere since the macOS/Windows jobs
      # were disabled, and it is the path a JSC upgrade renaming the dlsym'd mangled
      # symbol drops the whole runtime onto.
      - name: Test (Lava behavior, C-API fallback)
        run: make test-lava-nohostfn

      # The Odin runner gives each test its own thread by default; on one thread the
      # eval call sites share the thread-local host-native registry and JSC's recycled
      # context addresses. That sharing is the shape of two already-fixed defects, and
      # nothing else in CI produces it. ~0.25s.
      - name: Test (Odin, single runner thread)
        run: make test-odin-serial

      # Real socket transport: start a Node origin and require lava's fetch output
      # to match Node's, over http://, https:// (TLS), and IPv6 loopback. Excluded
      # from `make test` because it binds a local port; runs here as its own gate.
      - name: Fetch transport smoke
        run: make test-fetch-smoke

      # node:net TCP server: run the echo-server fixture under Node and under Lava,
      # hit each with the same Node client, and require identical client output
      # (server parity). Binds a local port, so it is its own gate like fetch smoke.
      - name: Net server smoke
        run: make test-net-smoke

      # node:http server: run the echo HTTP server fixture under Node and under Lava,
      # hit each with the same Node http client, and require identical deterministic
      # response fields (server parity). Binds a local port — its own gate.
      - name: HTTP server smoke
        run: make test-http-smoke

      # node:https server: a self-signed cert is generated, the Lava HTTPS server is hit by
      # Lava's own TLS client (fetch) over both backends (proactor + readiness), and the
      # synchronous cert/option error cases are asserted. Binds a local port — its own gate.
      - name: HTTPS server smoke
        run: make test-https-smoke

      # Multi-core workers (Slice 3a): N workers share a port via SO_REUSEPORT, load distributes,
      # listen(0) is rejected, SIGTERM drains gracefully. Binds a local port — its own gate.
      - name: Multi-core workers smoke
        run: make test-multicore-smoke

      # MSG_ZEROCOPY (Slice 3b): a large body served via SEND_ZC must arrive byte-exact (the two-CQE
      # buffer-lifetime guard against a kernel-side UAF). Binds a local port — its own gate.
      - name: Zerocopy send smoke
        run: make test-zerocopy-smoke

      # Benchmarks: print the node-vs-Lava ratio table in the job log. Report-only for
      # now (never fails) because the bench/thresholds.json caps are uncalibrated
      # starters — once the ratios here are observed and the caps tightened, flip this
      # to `make bench-gate` to enforce regressions. See bench/README.md.
      - name: Benchmarks (report-only)
        run: make bench
