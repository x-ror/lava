name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two things may need tuning over time:
#   1. The Odin/LLVM version below (setup-odin inputs) as the project tracks
#      newer Odin dev builds.
#   2. The Windows job links JavaScriptCore from the Bun WebKit fork (static
#      libs, provisioned + cached via WEBKIT_TAG) and runs a real JSC-backed
#      lava.exe smoke, in addition to type-check, Windows codegen, and the
#      JSC-free event-loop unit tests.

jobs:
  linux:
    name: Linux (full build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev pkg-config

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      - name: Type-check
        run: make check

      - name: JavaScript lint and format
        run: make check-js

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (Lava behavior)
        run: make test-lava

      # Real socket transport: start a Node origin and require lava's fetch output
      # to match Node's, over http://, https:// (TLS), and IPv6 loopback. Excluded
      # from `make test` because it binds a local port; runs here as its own gate.
      - name: Fetch transport smoke
        run: make test-fetch-smoke

  macos:
    name: macOS (full build + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenSSL
        # The fetch TLS transport links Homebrew OpenSSL on Darwin (keg-only;
        # scripts/build.sh adds its lib path). brew is preinstalled on the runner.
        run: brew install openssl@3

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      - name: Type-check
        run: make check

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (Lava behavior)
        run: make test-lava

      # Same fetch smoke as Linux over the Darwin (kqueue + BSD-socket) transport.
      # macOS's system openssl is LibreSSL, whose `req -addext` may not run, so the
      # script falls back to HTTP-only cases there; the HTTP/IPv6 transport is the
      # coverage this adds (Linux still gates the HTTPS/TLS path).
      - name: Fetch transport smoke
        run: make test-fetch-smoke

  windows:
    name: Windows (type-check + codegen + eventloop + fs + sqlite tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Pinned oven-sh/WebKit release providing the prebuilt Windows JavaScriptCore
      # (see scripts/fetch-webkit-windows.sh). Bump to re-provision a newer JSC.
      WEBKIT_TAG: autobuild-9cb85a0716065c461bea14a0de9fe7139e5323aa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          llvm-version: "18"

      # Type-check every package natively for the Windows target. This exercises
      # pkg/jsc/bindings_windows.odin and the select() event-loop backend.
      - name: Type-check
        run: |
          odin check cmd/lava -collection:lava=.
          odin check pkg/runtime -no-entry-point -collection:lava=.
          odin check pkg/runtime/eventloop -no-entry-point
          odin check pkg/std/sqlite -no-entry-point
          odin check pkg/jsc -no-entry-point

      # The event-loop core has no JavaScriptCore dependency, so it links and
      # runs for real on Windows (IOCP backend included).
      - name: Event-loop unit tests
        run: odin test pkg/runtime/eventloop

      # Fast canary: full Windows codegen of the JSC-using runtime + CLI without
      # linking, so a source/codegen break is caught before the (heavier) JSC link
      # step below provisions WebKit.
      - name: Windows codegen (no link)
        run: |
          mkdir -p build
          odin build cmd/lava -collection:lava=. -build-mode:obj -out:build/lava.obj

      # --- Real link for JSC-backed runtime tests ---
      # JavaScriptCore is provisioned from the Bun project's WebKit fork (static
      # libs; see scripts/fetch-webkit-windows.sh), statically linked into lava.exe,
      # which the oracle/fetch suites below run through JavaScriptCore for real.
      - name: Cache JavaScriptCore (bun-webkit)
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: .deps/webkit
          key: bun-webkit-windows-amd64-${{ env.WEBKIT_TAG }}

      - name: Provision JavaScriptCore
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        run: WEBKIT_TAG="$WEBKIT_TAG" bash scripts/fetch-webkit-windows.sh

      # Set up the MSVC x64 developer environment (LIB/INCLUDE/PATH) so the linker
      # resolves system import libs via $LIB rather than absolute "C:\Program
      # Files\..." paths on the command line (which split on the space → LNK1181).
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache SQLite amalgamation
        id: cache-sqlite
        uses: actions/cache@v4
        with:
          path: .deps/sqlite
          key: sqlite-amalgamation-3530200

      - name: Provision SQLite amalgamation
        if: steps.cache-sqlite.outputs.cache-hit != 'true'
        run: bash scripts/fetch-sqlite-windows.sh

      # node:sqlite links a statically-built sqlite3.lib (there is no system
      # libsqlite3 on Windows). Compile the cached amalgamation with the MSVC cl
      # that msvc-dev-cmd just put on PATH; the link step below adds build/ to LIB so
      # pkg/std/sqlite's `system:sqlite3.lib` resolves.
      - name: Build SQLite (static)
        run: bash scripts/build-sqlite-windows.sh

      - name: Windows link
        run: |
          mkdir -p build
          # Resolve the JSC static libs via the linker's LIB search path rather than
          # a /LIBPATH on the command line, so no path-with-spaces reaches the link
          # line. msvc-dev-cmd already populated LIB with the CRT/SDK dirs.
          WK_WIN="$(cygpath -w "$PWD/.deps/webkit/bun-webkit/lib")"
          export LIB="$WK_WIN;$LIB"
          # build/ holds sqlite3.lib (built above); on LIB so `system:sqlite3.lib` resolves.
          export LIB="$(cygpath -w "$PWD/build");$LIB"
          # OpenSSL (tls.odin foreign-imports libssl.lib/libcrypto.lib). The runner
          # ships OpenSSL; add the dir that actually holds the import libs to LIB.
          OSSL_LIB="$(find '/c/Program Files/OpenSSL' '/c/Program Files/OpenSSL-Win64' -iname 'libssl.lib' 2>/dev/null | head -1 || true)"
          if [ -n "$OSSL_LIB" ]; then
            export LIB="$(cygpath -w "$(dirname "$OSSL_LIB")");$LIB"
            echo "OpenSSL libs: $(dirname "$OSSL_LIB")"
          else
            echo "WARNING: libssl.lib not found under C:\\Program Files\\OpenSSL*"
          fi
          # compiler-rt int128 builtins (__divti3/__fixdfti and helpers): JSC
          # references these but doesn't bundle them. The archive defines and indexes
          # them, yet lld won't pull them here via any archive mechanism (/INCLUDE,
          # on-demand, and /WHOLEARCHIVE all fail or clash with the half-float
          # routines JSC *does* bundle). So extract the specific object files and link
          # them directly — objects are always included, no index/ordering involved.
          RT_LIB="$(find '/c/Program Files/LLVM' -iname 'clang_rt.builtins-x86_64.lib' 2>/dev/null | head -1 || true)"
          RT_OBJS=""
          if [ -n "$RT_LIB" ]; then
            AR="$(command -v llvm-ar || echo '/c/Program Files/LLVM/bin/llvm-ar.exe')"
            mkdir -p build/rt && ( cd build/rt && "$AR" x "$RT_LIB" )
            # JSC bundles most builtins; only __divti3/__fixdfti are missing. Their
            # helper __udivmodti4 resolves from JSC, so extracting more just clashes.
            for sym in divti3 fixdfti; do
              f="$(find build/rt -name "${sym}.c.obj" | head -1)"
              [ -n "$f" ] && RT_OBJS="$RT_OBJS $(cygpath -w "$f")"
            done
            echo "extracted compiler-rt builtins:$RT_OBJS"
          else
            echo "WARNING: clang_rt.builtins-x86_64.lib not found under C:\\Program Files\\LLVM"
          fi
          # Static JSC pulls in WTF, bmalloc, ICU and a broad set of Win32 system
          # libraries (WTF threading/crypto/networking shims; Synchronization.lib for
          # WaitOnAddress/WakeByAddressSingle). JavaScriptCore.lib itself comes from
          # bindings_windows.odin's import.
          SYSLIBS="Synchronization.lib user32.lib gdi32.lib ole32.lib oleaut32.lib shell32.lib shlwapi.lib advapi32.lib winmm.lib bcrypt.lib crypt32.lib ws2_32.lib userenv.lib dbghelp.lib iphlpapi.lib version.lib comctl32.lib rpcrt4.lib secur32.lib usp10.lib windowscodecs.lib"
          # Use Odin's bundled lld linker (from the setup-odin LLVM) — its invocation
          # quotes the MSVC toolchain paths correctly (the default link.exe path
          # splits "C:\Program Files\..." → LNK1181).
          odin build cmd/lava -collection:lava=. -out:build/lava.exe -linker:lld \
            -extra-linker-flags:"$RT_OBJS WTF.lib bmalloc.lib sicuuc.lib sicuin.lib sicudt.lib $SYSLIBS"

      # Every oracle suite supported on Windows (event-loop + node:fs + node:sqlite)
      # against the JSC-linked lava.exe, via the same scripts/run-oracles.sh that
      # `make test-lava` uses on Linux/macOS. Only the node-compat suite is
      # POSIX-path-shaped, so run-oracles.sh skips it here; it runs on Linux/macOS.
      # The fs leg validates the Win32 GetLastError -> errno mapping
      # (fs_os_error_to_code) end to end; the sqlite leg exercises the statically
      # linked sqlite3.lib through the node:sqlite bridge.
      - name: Oracle suites (event-loop + fs + sqlite)
        run: NODE_BIN=node LAVA_BIN="$PWD/build/lava.exe" RUN_LAVA=1 ./scripts/run-oracles.sh

      # Fetch transport smoke over the real Winsock + select() backend, reusing the
      # build/lava.exe linked above (not `make test-fetch-smoke`, whose `build`
      # prerequisite runs the POSIX scripts/build.sh → bin/lava). Drives the same
      # node-vs-lava cases over a loopback socket; HTTPS cases run only when the
      # runner's openssl CLI can mint a cert, otherwise the HTTP path still gates.
      - name: Fetch transport smoke
        run: NODE_BIN=node LAVA_BIN="$PWD/build/lava.exe" ./scripts/run-fetch-smoke.sh
