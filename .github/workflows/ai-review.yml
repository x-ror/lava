name: AI review

# Runs /pr-gate (.claude/skills/pr-gate) against the PR diff and writes the scorecard
# to the run summary. Advisory only — never add it to required checks. An LLM verdict
# or an API outage must not red a PR that CI says is green.
#
# The pipeline it runs is master's, not the PR's: the action restores .claude/ and
# CLAUDE.md from origin/master because the PR head is untrusted. See the "Flag a no-op
# review" step at the bottom, which exists because that makes a silent zero-turn run
# possible.
#
# This job runs NO gates. ci.yml already executes make check / check-js / build / test /
# test-lava and every routed smoke on the same commit; re-running them here would double
# CI minutes and — the real objection — would execute the PR's own Makefile, scripts and
# Odin/JS inside the one job that holds a credential. /pr-gate --review-only skips its
# mechanical step and reads ci.yml's conclusions via `gh pr checks` instead.
#
# Dormant until a credential exists: with neither secret set (including every fork PR,
# where secrets are never passed) the guarded steps skip and the job reports success.
# `secrets` is not available in `if:` at either job or step level, so the boolean is
# computed in the job-level `env:` block, which can read it. Note a step's own `env:` is
# NOT in scope for that same step's `if:` — the bridge must live at job level.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: string

# Distinct prefix from ci.yml's `ci-...`: concurrency groups are repo-scoped, so reusing
# it would make this job and CI cancel each other on the same ref.
concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: pr-gate (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Fork PRs get no secrets, so the run would be a no-op anyway — skip the runner
    # entirely. Drafts and the weekly dependabot bump are not worth the tokens.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')

    permissions:
      contents: read
      pull-requests: read
      # `gh pr checks` reads the CI conclusions --review-only delegates to; without
      # this the rollup query is not accessible and every gate reads as unknown.
      checks: read

    env:
      # Only a boolean reaches the job environment — never the credential itself.
      HAS_CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

    steps:
      - name: Report dormant (no credential configured)
        if: env.HAS_CLAUDE_CREDENTIAL != 'true'
        run: |
          {
            printf '%s\n' '## AI review skipped'
            printf '%s\n' ''
            printf '%s\n' 'Neither `CLAUDE_CODE_OAUTH_TOKEN` nor `ANTHROPIC_API_KEY` is set, so'
            printf '%s\n' 'no review ran. This is not a failure — CI is the gate that matters.'
            printf '%s\n' ''
            printf '%s\n' 'To enable: run `claude setup-token` locally (Claude Pro/Max subscription;'
            printf '%s\n' 'no API key needed) and store the result as the repository secret'
            printf '%s\n' '`CLAUDE_CODE_OAUTH_TOKEN`. An `ANTHROPIC_API_KEY` secret works too and'
            printf '%s\n' 'is billed as API usage instead.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Full history: --branch mode needs `git merge-base origin/master HEAD`, and the
      # specialists' allowlist expects git log/blame to work. A shallow clone breaks both.
      - name: Checkout
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The workspace is then handed to an LLM agent. actions/checkout otherwise
          # leaves the job token in .git/config, where anything that reads the tree can
          # find it — the point of the restricted --allowedTools list is defeated if the
          # credential is sitting in a file.
          persist-credentials: false
          # On workflow_dispatch the default ref is the branch the run was dispatched
          # from, which need not be the PR named in `pr` — the agent would read one tree
          # and diff another. Empty on pull_request, where checkout's own default (the
          # merge ref) is already right.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      # No toolchain steps on purpose: no apt-get, no setup-odin, no setup-vp. The
      # specialists are read-only and need the source tree, the diff and git history —
      # nothing that requires a build. Provisioning JSC/Odin/LLVM here would cost minutes
      # per run to reproduce a result ci.yml already has.
      - name: Run /pr-gate
        id: review
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # `gh pr view/diff/checks` inside the skill authenticate with this.
          GH_TOKEN: ${{ github.token }}
        with:
          # Without this the action tries to mint a Claude GitHub App installation token,
          # which needs an OIDC exchange and therefore `id-token: write` (plus the App
          # installed on the repo) — it fails with "Unable to get
          # ACTIONS_ID_TOKEN_REQUEST_URL env variable" otherwise. Passing a token sets
          # OVERRIDE_GITHUB_TOKEN, which setupGitHubToken returns before reaching the OIDC
          # path. The built-in GITHUB_TOKEN is the right one here: this job only reads the
          # PR and writes the run summary, so it needs no App identity and no
          # token-minting privilege. (The action's docs steer you to a custom App instead
          # — that guidance is for comment-posting/tag mode, where the comment author
          # identity matters. It does not apply to a read-only automation run.)
          github_token: ${{ github.token }}
          # Whichever is configured is used; an unset secret is an empty string and is
          # ignored. OAuth covers a Pro/Max subscription, the API key is billed usage.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Explicit --pr: the default (--local) diffs the working tree, which on a
          # pull_request checkout of the merge commit is empty, and the skill would stop
          # with "nothing to review".
          prompt: /pr-gate --pr ${{ env.PR_NUMBER }} --review-only
          # Task must be allowed — the skill's value is the parallel specialist fan-out.
          # Bash is restricted to read-only git/gh/rg; no --dangerously-skip-permissions
          # in a job that holds a credential.
          #
          # --model is pinned rather than left to the action's default: a review job whose
          # model can drift between action releases gives non-comparable verdicts run to
          # run. Every agent in .claude/agents is `model: inherit`, so this one flag also
          # sets the model for all 7-9 specialists the fan-out spawns. Override per agent
          # with a `model:` line in that agent's frontmatter.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Task,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git blame:*),Bash(rg:*),Bash(wc:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"

      # A review that does nothing must not read as a review that found nothing.
      # `continue-on-error` above keeps a failed review from redding the PR, which also
      # means a no-op run reports success — the check is green and no one looks.
      #
      # THREE signals, not one. `turns == 0` alone was not enough: every observed run of
      # this job so far reported `is_error: true`, `num_turns: 1`, `total_cost_usd: 0` and
      # finished in ~200 ms — it fails immediately after init, almost certainly a
      # credential/model-access problem. One turn is not zero turns, so the old guard let
      # it through and wrote "AI review ran" into the summary. Two merged PRs displayed a
      # green AI review that never happened. A run that errored, or that cost nothing,
      # examined nothing, whatever its turn count.
      #
      # Zero turns almost always means the prompt resolved to nothing. The usual cause is
      # structural rather than a typo: the action restores .claude/ and CLAUDE.md from
      # origin/master because the PR head is untrusted (it keeps the PR's copies in
      # .claude-pr/, unexecuted), so a skill that exists only on the PR branch is simply
      # absent at run time. A PR that adds or edits the pipeline is therefore reviewed by
      # master's pipeline, and the very first one — which introduces it — is reviewed by
      # nothing at all.
      - name: Flag a no-op review
        if: always() && env.HAS_CLAUDE_CREDENTIAL == 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          read -r turns cost errored < <(node -e '
            const fs = require("fs");
            let msgs = [];
            try {
              const raw = fs.readFileSync(process.argv[1], "utf8");
              try {
                const parsed = JSON.parse(raw);
                msgs = Array.isArray(parsed) ? parsed : [parsed];
              } catch {
                msgs = raw.split("\n").filter(Boolean).flatMap(l => {
                  try { return [JSON.parse(l)]; } catch { return []; }
                });
              }
            } catch {}
            const r = [...msgs].reverse().find(m => m && m.type === "result");
            const f = (k) => (r && r[k] !== undefined ? String(r[k]) : "unknown");
            console.log(`${f("num_turns")} ${f("total_cost_usd")} ${f("is_error")}`);
          ' "$EXECUTION_FILE" 2>/dev/null || echo "unknown unknown unknown")

          reason=
          case "$turns" in 0|unknown) reason="it made $turns turns" ;; esac
          [ -z "$reason" ] && [ "$errored" = "true" ] && reason='it reported is_error: true'
          [ -z "$reason" ] && case "$cost" in 0|0.0|unknown) reason="it cost \$$cost" ;; esac

          if [ -n "$reason" ]; then
            echo "::warning title=AI review did not run::No diff was examined — $reason. The check is green because the job is advisory, not because the code was reviewed."
            {
              printf '%s\n' '## AI review did not run'
              printf '%s\n' ''
              printf '%s\n' "Turns: \`$turns\`. Cost: \`$cost\`. is_error: \`$errored\`. Nothing was reviewed ($reason)."
              printf '%s\n' ''
              printf '%s\n' 'An immediate `is_error` with one turn and zero cost is a credential or'
              printf '%s\n' 'model-access failure — check that `CLAUDE_CODE_OAUTH_TOKEN` (or'
              printf '%s\n' '`ANTHROPIC_API_KEY`) is still valid and that the pinned `--model` is'
              printf '%s\n' 'available to it. Zero turns instead means the prompt resolved to nothing: the'
              printf '%s\n' 'action restores `.claude/` and `CLAUDE.md` from `origin/master` because the PR'
              printf '%s\n' 'head is untrusted, so a skill present only on this branch does not exist at run'
              printf '%s\n' 'time. Either way, read the step log.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "AI review ran: $turns turns, cost $cost." >> "$GITHUB_STEP_SUMMARY"
          fi
